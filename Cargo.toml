[package]
name = "eml-reader"
version = "0.2.1"
edition = "2021"
rust-version = "1.98"
resolver = "3"
description = "Viewer and analyser for e-mail files (.eml, .msg, mbox): attachments, header analysis, phishing checks"
authors = ["© StofflHD and Claude"]
license = "GPL-3.0-or-later"
repository = "https://github.com/StofflHD/EML-Reader"

[dependencies]
# Pinned: the egui API changes between releases.
eframe = { version = "=0.29.1", features = ["persistence"] }
egui_extras = "=0.29.1"
mail-parser = { version = "1", features = ["full_encoding"] }
html2text = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
rsa = "0.9"
cfb = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
